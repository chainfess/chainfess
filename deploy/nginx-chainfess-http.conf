# Phase 1 (before the certificate exists): ACME challenge only.
server {
    listen 80;
    listen [::]:80;
    server_name chainfess.pro www.chainfess.pro;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://chainfess.pro$request_uri; }
}
