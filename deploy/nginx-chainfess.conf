# /etc/nginx/sites-available/chainfess : chainfess.pro + www (phase 2, after the certificate exists)
server {
    listen 80;
    listen [::]:80;
    server_name chainfess.pro www.chainfess.pro;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://chainfess.pro$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.chainfess.pro;
    ssl_certificate /etc/letsencrypt/live/chainfess.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chainfess.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log off;
    return 301 https://chainfess.pro$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chainfess.pro;
    ssl_certificate /etc/letsencrypt/live/chainfess.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chainfess.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/chainfess.access.log cf_noip;   # no $remote_addr
    error_log  /var/log/nginx/chainfess.error.log crit;
    absolute_redirect off;
    gzip on; gzip_vary on; gzip_min_length 256;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml text/plain;
    client_max_body_size 256k;
    limit_req_status 429;

    root /opt/chainfess/web/dist;
    index index.html;
    error_page 404 /404.html;
    include /etc/nginx/snippets/chainfess-headers.conf;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location ~ /\.(?!well-known) { return 404; }

    # clean URLs: /docs -> docs.html or docs/index.html
    location / { try_files $uri $uri.html $uri/ =404; }
    location = /404.html { internal; }

    location = /token.json {
        include /etc/nginx/snippets/chainfess-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # ---- production API (127.0.0.1:4905)
    location = /api/sign {
        limit_req zone=cf_sign burst=3 nodelay;
        include /etc/nginx/snippets/chainfess-headers.conf;
        proxy_pass http://127.0.0.1:4905; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location = /api/block {
        limit_req zone=cf_block burst=10 nodelay;
        include /etc/nginx/snippets/chainfess-headers.conf;
        proxy_pass http://127.0.0.1:4905; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }
    location /api/ {
        limit_req zone=cf_api burst=30 nodelay;
        include /etc/nginx/snippets/chainfess-headers.conf;
        proxy_pass http://127.0.0.1:4905; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }

    # ---- staging (127.0.0.1:4906): prefix stripped, never indexed
    location = /staging/api/sign {
        limit_req zone=cf_sign_stg burst=3 nodelay;
        include /etc/nginx/snippets/chainfess-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        rewrite ^/staging/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:4906; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location = /staging/api/block {
        limit_req zone=cf_block_stg burst=10 nodelay;
        include /etc/nginx/snippets/chainfess-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        rewrite ^/staging/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:4906; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }
    location /staging/ {
        limit_req zone=cf_api_stg burst=30 nodelay;
        include /etc/nginx/snippets/chainfess-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        rewrite ^/staging/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:4906; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }
}
