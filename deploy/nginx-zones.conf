# /etc/nginx/conf.d/chainfess-zones.conf  (http context; every name is prefixed cf_ to stay unique on this shared box)
limit_req_zone $binary_remote_addr zone=cf_sign:10m      rate=10r/m;
limit_req_zone $binary_remote_addr zone=cf_sign_stg:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=cf_block:10m     rate=60r/m;
limit_req_zone $binary_remote_addr zone=cf_block_stg:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=cf_api:10m       rate=120r/m;
limit_req_zone $binary_remote_addr zone=cf_api_stg:10m   rate=120r/m;
log_format cf_noip '$time_iso8601 "$request_method $uri" $status $body_bytes_sent $request_time';
